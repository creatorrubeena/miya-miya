<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Not Found | Miya Miya Restaurant</title>
  <meta name="description" content="The page you are looking for does not exist. Return to Miya Miya Restaurant homepage for family dining and authentic food in Malappuram." />
  <meta name="robots" content="noindex, follow" />
  <link rel="stylesheet" href="/style.css" />
  <style>
    .error-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background-color: var(--color-espresso);
      color: var(--color-ivory);
      text-align: center;
      padding: 2rem;
    }
    .error-code {
      font-size: 8rem;
      font-family: var(--font-serif);
      color: var(--color-gold);
      line-height: 1;
      margin-bottom: 1rem;
    }
    .error-title {
      font-size: 2.2rem;
      font-family: var(--font-serif);
      margin-bottom: 1rem;
    }
    .error-msg {
      font-size: 1.1rem;
      color: rgba(245,240,232,0.7);
      max-width: 500px;
      margin-bottom: 2.5rem;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div class="error-container">
    <div class="error-code">404</div>
    <h1 class="error-title">Page Not Found</h1>
    <p class="error-msg">The page you are looking for might have been removed, had its name changed, or is temporarily unavailable.</p>
    <a href="/" class="btn btn-gold">Back to Homepage</a>
  </div>
</body>
</html>
